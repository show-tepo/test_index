<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GitHub Pages Test</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f7f7ff, #e8f4ff);
      color: #1f2937;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      background: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,.12);
      max-width: 720px;
      margin: 24px;
      text-align: center;
    }
    h1 { margin-top: 0; font-size: clamp(2rem, 5vw, 3.5rem); }
    p { font-size: 1.1rem; line-height: 1.8; }
    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-weight: 700;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">GitHub Pages Test</div>
    <h1>公開テストページ</h1>
    <p>このページは ChatGPT から GitHub リポジトリに作成したテスト用の静的HTMLです。</p>
    <p>表示できていれば、GitHub Pages の準備はほぼOKです。</p>
  </main>
</body>
</html>
