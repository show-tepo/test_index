<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>お盆ガード100%</title>
<style>
  :root{--bg:#fff7ed;--ink:#231f20;--accent:#ef4444;--ok:#16a34a;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fff7ed,#fde68a);color:var(--ink);min-height:100vh;overflow:hidden;touch-action:none}
  header{position:fixed;top:0;left:0;right:0;z-index:5;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:900;text-shadow:0 1px 0 #fff}
  .pill{background:#fff;border:3px solid #111;border-radius:999px;padding:7px 12px;box-shadow:0 4px 0 #111;font-size:14px}
  #stage{position:fixed;inset:54px 10px 18px;border:4px solid #111;border-radius:28px;background:linear-gradient(#bfdbfe 0 58%,#86efac 58%);overflow:hidden;box-shadow:0 10px 0 #111}
  #walker{position:absolute;width:92px;height:168px;left:40%;top:42%;transform:translate(-50%,-50%);z-index:2}
  .head{position:absolute;left:27px;top:0;width:38px;height:38px;background:#f4b183;border:3px solid #111;border-radius:50%}
  .body{position:absolute;left:24px;top:36px;width:44px;height:78px;background:#f4b183;border:3px solid #111;border-radius:24px}
  #tray{position:absolute;width:118px;height:82px;border-radius:50%;background:#d97706;border:5px solid #111;z-index:4;left:50%;top:70%;transform:translate(-50%,-50%)}
  #rankingBox{position:fixed;right:10px;bottom:10px;background:#fff;border:3px solid #111;border-radius:16px;padding:10px 14px;font-weight:700;z-index:6;max-width:200px}
  #rankingBox h3{margin:0 0 6px;font-size:14px}
  #rankingBox ol{margin:0;padding-left:18px}
  #rankingBox li{font-size:12px;display:flex;justify-content:space-between}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:10}
  .card{background:#fff;border:4px solid #111;border-radius:20px;padding:20px;text-align:center}
</style>
</head>
<body>
<header><div class="pill">🍱 お盆ガード100%</div><div class="pill">SCORE <span id="score">0.0</span></div></header>
<div id="stage"><div id="walker"></div><div id="tray"></div></div>
<div id="rankingBox"><h3>🏆 TOP5</h3><ol id="ranking"></ol></div>
<div id="modal"><div class="card"><h1>スタート</h1><button id="start">開始</button></div></div>
<script src="js/ranking.js"></script>
<script>
const gameId='obon';
const rankingEl=document.getElementById('ranking');
KusogeRanking.render(gameId,rankingEl);
let score=0,playing=false;
document.getElementById('start').onclick=()=>{playing=true;score=0;document.getElementById('modal').style.display='none';loop()}
function loop(){if(!playing)return;score+=0.1;document.getElementById('score').textContent=score.toFixed(1);if(Math.random()<0.01){end()}requestAnimationFrame(loop)}
function end(){playing=false;const name=prompt('名前を入力','名無し');KusogeRanking.save(gameId,score,name);KusogeRanking.render(gameId,rankingEl);document.getElementById('modal').style.display='grid'}
</script>
</body>
</html>
